
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShadowManga | دنیای داستان‌ها</title>
<style>
:root {
  --bg:#0c0a12;
  --panel:#171321;
  --purple:#a78bfa;
  --pink:#f0abfc;
  --red:#fb7185;
  --text:#f7f2ff;
  --muted:#b8adc9;
  --line:#382c4b;
}
* { box-sizing:border-box }
body {
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(ellipse at top,#241337,var(--bg) 65%);
  color:var(--text);
  line-height:1.8;
}
button,input,textarea,select { font:inherit }
button { cursor:pointer }
.container { width:min(1120px,92%);margin:auto }
header {
  position:sticky;top:0;z-index:10;
  background:#0c0a12ed;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.navbar,.account-area,nav,.actions,.modal-header,.search {
  display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;justify-content:space-between;
}
.navbar { padding:14px 0 }
.logo {
  font-size:25px;font-weight:bold;
  color:var(--text);text-decoration:none;
}
.logo span { color:var(--red) }
nav a { color:var(--muted);text-decoration:none }
nav a:hover { color:white }
.button {
  border:0;border-radius:10px;padding:10px 16px;
  background:linear-gradient(120deg,var(--purple),var(--pink));
  color:#100b19;font-weight:bold;
}
.secondary {
  background:#241b33;border:1px solid var(--line);color:var(--text);
}
button:disabled { opacity:.5;cursor:not-allowed }
.hero {
  padding:48px 0;display:grid;
  grid-template-columns:1.2fr .8fr;
  align-items:center;gap:28px;
}
h1 { font-size:clamp(32px,5vw,55px);line-height:1.5 }
h1 span,.symbol { color:var(--purple) }
.description,.muted { color:var(--muted) }
.eyebrow { color:var(--red);font-weight:bold }
.hero-art {
  min-height:250px;display:grid;place-items:center;
  text-align:center;padding:25px;
  border:1px solid var(--line);border-radius:25px;
  background:linear-gradient(145deg,#39224f,#171321,#401c35);
}
.symbol { font-size:80px }
section { padding:24px 0 }
input,textarea,select {
  width:100%;padding:12px;border-radius:10px;
  border:1px solid var(--line);
  background:#100d18;color:white;
}
label { display:block;margin:12px 0 5px }
.manga-grid {
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;margin-top:18px;
}
.manga-card,.community-card {
  overflow:hidden;border:1px solid var(--line);
  border-radius:16px;background:var(--panel);
}
.cover {
  height:240px;display:grid;place-items:center;
  font-size:65px;background:linear-gradient(135deg,#402554,#171321,#4b1d37);
  overflow:hidden;
}
.cover img { width:100%;height:100%;object-fit:cover;display:block }
.card-content { padding:17px }
.card-content p { color:var(--muted);font-size:14px;min-height:48px }
.tag {
  display:inline-block;margin:3px;padding:3px 9px;
  border-radius:20px;background:#30223f;
  color:#dfccff;font-size:12px;
}
.community { display:grid;grid-template-columns:repeat(2,1fr);gap:18px }
.community-card { padding:18px;margin:10px 0 }
.notice,.status {
  padding:12px;border-right:4px solid var(--red);
  background:#241522;border-radius:8px;overflow-wrap:anywhere;
}
.empty { display:none;color:var(--muted);padding:20px;text-align:center }
.modal {
  display:none;position:fixed;inset:0;z-index:20;
  background:#000d;padding:16px;align-items:center;justify-content:center;
}
.modal.open { display:flex }
.modal-content {
  width:min(650px,100%);max-height:92vh;overflow:auto;
  padding:22px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;
}
.modal-content.wide { width:min(1000px,100%) }
.close { color:white;background:transparent;border:0;font-size:28px }
.message {
  margin-top:12px;padding:10px;background:#241b33;
  border-radius:9px;overflow-wrap:anywhere;
}
.message:empty { display:none }
.chapter-row {
  padding:14px;margin:12px 0;
  border:1px solid var(--line);border-radius:12px;
  background:#100d18;
}
.chapter-row .actions { justify-content:flex-start }
.reader-page {
  display:block;max-width:100%;height:auto;
  margin:14px auto;border-radius:8px;
}
.reader-pdf {
  width:100%;height:75vh;
  border:1px solid var(--line);border-radius:10px;background:white;
}
.reader-toolbar {
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;margin:12px 0;
}
.small { font-size:13px;color:var(--muted) }
footer {
  margin-top:35px;padding:25px 0;
  border-top:1px solid var(--line);
  color:var(--muted);text-align:center;
}
[hidden] { display:none!important }
@media(max-width:800px) {
  .hero,.manga-grid,.community { grid-template-columns:1fr }
  .navbar { align-items:flex-start }
  .search { flex-direction:column;align-items:stretch }
  nav { justify-content:flex-start }
}
</style>
</head>
